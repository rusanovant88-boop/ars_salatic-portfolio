# SALATIC / MANAGER — Pages CMS. Sign in at https://app.pagescms.org/
# This editor writes directly to data/portfolio.json on GitHub.
media:
  input: assets
  output: /assets
  rename: safe
  categories: [image]
content:
  - name: portfolio
    label: SALATIC / MANAGER — Projects
    type: file
    path: data/portfolio.json
    format: json
    fields:
      - name: version
        label: Schema version
        type: number
        readonly: true
      - name: projects
        label: Selected works (drag to reorder; draft projects are hidden)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: id
            label: Unique project ID (letters/numbers/hyphens)
            type: string
            required: true
            pattern: "^[a-zA-Z][a-zA-Z0-9-]*$"
          - name: order
            label: Order number (10, 20, 30 ...)
            type: number
            description: "Smaller numbers appear first. Keep unique values; the list can also be reordered."
          - name: published
            label: Published
            type: boolean
          - name: filename
            label: Finder filename
            type: string
            required: true
          - name: roleShort
            label: Finder role
            type: string
            required: true
          - name: title
            label: Case title
            type: text
            required: true
          - name: role
            label: Full role text
            type: string
          - name: layout
            label: Desktop case layout
            type: select
            options:
              values:
                - name: split
                  label: Classic — text left, player right
                - name: wide
                  label: Wide media — narrower text
                - name: editorial
                  label: Editorial — wider text
          - name: preview
            label: Hover image (16:9)
            type: image
          - name: paragraphs
            label: Case paragraphs (reorderable)
            type: text
            list: true
          - name: media
            label: Video and KV items (reorderable)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: type
                label: Media type
                type: select
                options:
                  values: [video, kv]
              - name: vimeoId
                label: Vimeo numeric ID (video only)
                type: string
                description: "Paste only the ID, for example 1240745678"
              - name: image
                label: KV image (KV only)
                type: image
              - name: label
                label: Description / accessible label
                type: string
